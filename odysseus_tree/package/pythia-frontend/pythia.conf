worker_processes 1;
pid /run/pythia-frontend.pid;
error_log /var/log/nginx/error.log;

events {
    worker_connections 64;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;

    server {
        listen 80;
        root /usr/share/pythia-frontend;

        # API routes served by pythia-backend
        location /profiles { proxy_pass http://127.0.0.1:3000; }
        location /messages { proxy_pass http://127.0.0.1:3000; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
